<!-- templates/reports/partials/report_filters.html — Filtros do relatório (HTMX) -->
<form hx-get="{% url 'reports:tickets' %}" hx-target="#report-content" hx-swap="innerHTML" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4 mb-6">
    <div class="lg:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Busca</label>
        <input type="text" name="search" value="{{ current_filters.search|default:'' }}"
               placeholder="Problema, solicitante, solução..."
               class="form-input w-full">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
        <select name="status" class="form-select w-full" multiple>
            {% for value, label in status_choices %}
            <option value="{{ value }}" {% if value in current_filters.status %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Prioridade</label>
        <select name="prioridade" class="form-select w-full" multiple>
            {% for value, label in prioridade_choices %}
            <option value="{{ value }}" {% if value in current_filters.prioridade %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Técnico</label>
        <select name="tecnico" class="form-select w-full" multiple>
            {% for t in tecnicos %}
            <option value="{{ t.pk }}" {% if t.pk|stringformat:"s" in current_filters.tecnico %}selected{% endif %}>
                {{ t.usuario.get_full_name|default:t.usuario.username }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Data Início</label>
        <input type="date" name="date_from" value="{{ current_filters.date_from|default:'' }}"
               class="form-input w-full">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Data Fim</label>
        <input type="date" name="date_to" value="{{ current_filters.date_to|default:'' }}"
               class="form-input w-full">
    </div>
    <div class="lg:col-span-6 flex gap-2">
        <button type="submit" class="btn-primary">
            <i class="fa-solid fa-filter mr-2"></i>Filtrar
        </button>
        <a href="?export=csv" class="btn-success">
            <i class="fa-solid fa-file-csv mr-2"></i>CSV
        </a>
        <a href="?export=excel" class="btn-primary">
            <i class="fa-solid fa-file-excel mr-2"></i>Excel
        </a>
    </div>
</form>
