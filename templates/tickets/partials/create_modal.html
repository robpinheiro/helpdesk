<!-- templates/tickets/partials/create_modal.html — Modal de Criação Rápida -->
<div x-data="modal()" x-init="open()" x-show="open" x-transition class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-hidden" @click.outside="close()">
        <div class="p-4 border-b flex justify-between items-center">
            <h3 class="text-lg font-semibold text-gray-900">Novo Ticket</h3>
            <button @click="close()" class="text-2xl leading-none text-gray-400 hover:text-gray-600">&times;</button>
        </div>
        <form hx-post="{% url 'tickets:create' %}" hx-target="#modal-container" hx-swap="innerHTML" class="p-4 overflow-y-auto max-h-[70vh]">
            {% csrf_token %}
            {{ form.solicitante }}

            <div class="mb-4">
                <label for="{{ form.data_ocorrido.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Data do Ocorrido *</label>
                {{ form.data_ocorrido }}
                {% if form.data_ocorrido.errors %}
                <p class="text-red-500 text-sm mt-1">{{ form.data_ocorrido.errors.0 }}</p>
                {% endif %}
            </div>

            <div class="mb-4">
                <label for="{{ form.problema.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Problema *</label>
                {{ form.problema }}
                {% if form.problema.errors %}
                <p class="text-red-500 text-sm mt-1">{{ form.problema.errors.0 }}</p>
                {% endif %}
            </div>

            <div class="mb-4">
                <label for="{{ form.prioridade.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Prioridade</label>
                {{ form.prioridade }}
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t">
                <button type="button" @click="close()" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-save mr-2"></i>Criar Ticket
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function modal() {
    return {
        open: true,
        close() {
            this.open = false;
            // Remove modal do DOM após animação
            setTimeout(() => this.$el.remove(), 200);
        }
    }
}
</script>
