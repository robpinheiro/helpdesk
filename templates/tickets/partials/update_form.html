<!-- templates/tickets/partials/update_form.html — Form de Atualização (HTMX) -->
<div x-data="modal()" x-init="open()" x-show="open" x-transition class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-hidden" @click.outside="close()">
        <div class="p-4 border-b flex justify-between items-center">
            <h3 class="text-lg font-semibold text-gray-900">Editar Ticket #{{ ticket.pk }}</h3>
            <button @click="close()" class="text-2xl leading-none text-gray-400 hover:text-gray-600">&times;</button>
        </div>
        <form hx-post="{% url 'tickets:update' ticket.pk %}" hx-target="#modal-container" hx-swap="innerHTML" class="p-4 overflow-y-auto max-h-[70vh]">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="{{ form.tecnico.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Técnico</label>
                    {{ form.tecnico }}
                </div>
                <div>
                    <label for="{{ form.status.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    {{ form.status }}
                </div>
            </div>
            <div class="mb-4">
                <label for="{{ form.observacoes.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Observações</label>
                {{ form.observacoes }}
            </div>
            <div class="mb-4">
                <label for="{{ form.solucao.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Solução</label>
                {{ form.solucao }}
            </div>
            <div class="mb-4">
                <label for="{{ form.tempo_gasto.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Tempo Gasto (HH:MM:SS)</label>
                {{ form.tempo_gasto }}
            </div>
            <div class="flex justify-end gap-3 pt-4 border-t">
                <button type="button" @click="close()" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-save mr-2"></i>Salvar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function modal() {
    return {
        open: true,
        close() {
            this.open = false;
            setTimeout(() => this.$el.remove(), 200);
        }
    }
}
</script>
